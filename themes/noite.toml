# Leme theme. Copy this file to %APPDATA%\leme\themes\ and edit it to make
# your own. Colors are #rrggbb or #rrggbbaa. Missing keys fall back to the
# built-in theme for the same `dark` value.
#
# `page` is the paper: with `page_colors = "paper"` the white of the PDF
# is tinted with it.
#
# Noite: burnt umber and candle flame. The page is the only thing lit;
# the accent is the light, not a red.
name = "Noite"
dark = true

background = "#14110d"
surface = "#1b1712"
raised = "#261f18"
border = "#3a3126"
text = "#eadfc8"
text_muted = "#a39680"
accent = "#e0a458"
page = "#eadfc8"
hover = "#eadfc814"
selection = "#e0a45880"
match = "#d9a4416b"
match_current = "#d98a2bb8"
