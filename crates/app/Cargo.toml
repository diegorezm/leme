[package]
name = "leme"
description = "A fast, minimal, local-first PDF reader for Windows and Linux, built with Rust and Slint."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "leme"
path = "src/main.rs"

[dependencies]
domain.workspace = true
pdf.workspace = true
web.workspace = true
# raw-window-handle: to color the native title bar from the theme.
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"
# Native "Open file" dialog.
rfd = "0.18"
serde.workspace = true
toml.workspace = true

# Copy selected text.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

# Copy selected text on X11 and Wayland, where no system call does it.
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[build-dependencies]
slint-build = "1.18"
# Embeds the icon and version info in leme.exe (Explorer, taskbar, installer).
winresource = { version = "0.1", default-features = false }
