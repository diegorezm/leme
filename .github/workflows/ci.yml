name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # Lint already compiles the app; tests cover the crates with logic,
      # without rebuilding Slint, and with dependencies unoptimized (the
      # dev profile optimizes them for smooth `cargo run`, which tests
      # don't need).
      - name: Test
        shell: bash
        run: cargo test -p domain -p web -p pdf --config 'profile.dev.package."*".opt-level=0'
