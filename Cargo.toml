[workspace]
resolver = "2"
members = ["crates/domain", "crates/pdf", "crates/web", "crates/app"]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/diegorezm/leme"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
pdf = { path = "crates/pdf" }
web = { path = "crates/web" }
# Config, themes, annotations, and libraries are TOML files users can edit by hand.
serde = { version = "1", features = ["derive"] }
toml = "1.2"

# Debug builds still optimize dependencies (Slint, PDFium bindings), so
# `cargo run` scrolls smoothly; our own code stays fast to compile.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
